<!doctype html><html lang="en"><meta charset="utf-8"><title>Browzen child tab</title><style>body{font:18px system-ui;padding:35px;background:#131c2b;color:#e5edff}</style><h1>Managed child tab loaded</h1><p>This is a local synthetic page inside Browzen, not an external browser window.</p><button onclick="document.querySelector('output').textContent='Child JavaScript works'">Test child button</button><button id="reply">Send message to opener</button><output></output><script>document.querySelector('#reply').onclick=()=>{if(opener){opener.postMessage('Hello opener','https://browzen.test');document.querySelector('output').textContent='Reply sent';}else document.querySelector('output').textContent='No opener';};window.addEventListener('message',e=>{if(e.origin==='https://browzen.test')document.querySelector('output').textContent='Received: '+e.data+'; opener matches: '+(e.source===opener);});</script></html>
